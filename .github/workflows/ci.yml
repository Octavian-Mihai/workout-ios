name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-tests:
    name: iOS unit tests (WorkoutAppTests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        timeout-minutes: 5
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available destinations (diagnostic — never fails the job)
        continue-on-error: true
        run: xcodebuild -project WorkoutApp.xcodeproj -scheme WorkoutApp -showdestinations || true

      - name: Run WorkoutAppTests
        timeout-minutes: 15
        run: |
          xcodebuild -project WorkoutApp.xcodeproj -scheme WorkoutApp \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            test -only-testing:WorkoutAppTests

  web-tests:
    name: program-builder unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: program-builder/package-lock.json

      - run: npm ci
      - run: npm test

  schema-compat:
    name: iOS/web JSON contract schema check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: program-builder/package-lock.json

      - run: npm ci
      - run: npm run schema:check
